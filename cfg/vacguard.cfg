// VACGuard Protection Suite Configuration File
// Core detection logic and Fog-of-War methods credited to karola3vax.

// Master switches. Turning vacguard_enabled off stops every detector.
vacguard_enabled 1
cs2ac_enabled 1

// Fog-Of-War Anti-Wallhack settings.
vacguard_fow_enabled 1
cs2fow_enabled 1
cs2fow_worker_threads 4
cs2fow_automatic_bake 1

// Whitelisted SteamID64s are still detected and announced, but they are never punished.
vacguard_whitelist ""
cs2ac_whitelist ""

// Detection modules. They are all enabled by default.
cs2ac_aimbot_enabled 1
cs2ac_aimlock_enabled 1
cs2ac_antiaim_enabled 1
cs2ac_autostrafe_enabled 1
cs2ac_bhop_enabled 1
cs2ac_dll_injection_enabled 1
cs2ac_desubticking_enabled 1
cs2ac_doubletap_enabled 1
cs2ac_hyperscroll_enabled 1
cs2ac_inhuman_accuracy_enabled 1
cs2ac_invalid_cvar_enabled 1
cs2ac_invalid_input_enabled 1
cs2ac_irregular_behavior_enabled 1
cs2ac_namechanger_enabled 1
cs2ac_nulls_enabled 1
cs2ac_silentaim_enabled 1
cs2ac_subtick_spam_enabled 1

// Detection announcements.
cs2ac_chat_announcements 1
cs2ac_center_announcements 1

// Language used for chat, center-screen announcements, and Discord reports.
cs2ac_language "en"

// Commands run after a detection.
cs2ac_punishment_command "css_addban {steamid64} 0 VACGuard: {detection}"
cs2ac_kick_command "css_kick #{userid} VACGuard: {detection}"

// Optional Discord detection reports.
cs2ac_webhook_url ""
cs2ac_webhook_role_id ""
cs2ac_webhook_server_address ""

// Config load confirmation token
cs2ac_config_loaded
